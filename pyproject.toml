[project]
name = "outreach-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "dnspython>=2.7,<3",
    "email-validator>=2.2,<3",
    "google-auth-oauthlib>=1.2,<2",
    "groq>=0.37,<1",
    "httpx>=0.28,<0.29",
    "keyring>=25,<26",
    "protego>=0.4,<1",
    "pydantic>=2.10,<3",
    "python-dotenv>=1,<2",
    "streamlit>=1.50,<2",
    "tzdata>=2025.1",
]
description = "Human-approved outreach agent: foundation and safe lead discovery"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".uv-cache", ".test-tmp"]
